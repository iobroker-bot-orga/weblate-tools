name: add adapter

# Manually triggered workflow that creates a new Weblate component for an
# ioBroker adapter GitHub repository.
on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'GitHub URL of the adapter repository (full URL or shortform "owner/ioBroker.adaptername")'
        required: true
        type: string
      precheckOnly:
        description: 'Only evaluate the repository and print the report; make no changes'
        required: false
        type: boolean
        default: false
      debug:
        description: 'Enable debug logging'
        required: false
        type: boolean
        default: false

jobs:
  add-adapter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run add adapter
        env:
          # Retrieve the GitHub secret and pass it to the script via env var.
          WEBLATE_TOKEN: ${{ secrets.WEBLATE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ inputs.repo }}
          PRECHECK_ONLY: ${{ inputs.precheckOnly }}
          DEBUG: ${{ inputs.debug }}
          # API identifier of the custom "ioBroker: Save translations into
          # words.js" add-on. Configure it as a repository variable; when empty
          # the add-on is skipped.
          WORDS_ADDON_NAME: ${{ vars.WORDS_ADDON_NAME }}
        run: node lib/addAdapter.js
